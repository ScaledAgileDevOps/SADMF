<div class="practice-grid">
  {{ range $.Page.RegularPagesRecursive.ByWeight }}
  <a href="{{ .RelPermalink }}" class="practice-card practice-card--metric">
    {{ $unit := split (.Params.metricUnit | default "") " / " }}
    <span class="practice-card__unit" aria-hidden="true">
      <span class="practice-card__unit-num">{{ index $unit 0 }}</span>
      {{ with index $unit 1 }}<span class="practice-card__unit-denom">/ {{ . }}</span>{{ end }}
    </span>
    <div class="practice-card__body">
      <span class="practice-card__title">{{ .Title }}</span>
      {{ with .Params.description }}
      <p class="practice-card__desc">{{ . }}</p>
      {{ end }}
    </div>
    <span class="practice-card__arrow" aria-hidden="true">
      <i class="fa-solid fa-arrow-right"></i>
    </span>
  </a>
  {{ end }}
</div>
