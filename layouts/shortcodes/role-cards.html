{{ range $.Page.Sections.ByWeight }}
  {{ $section := . }}
  {{ with $section.RegularPages }}
  <h3 class="practice-category-heading">{{ $section.Title }}</h3>
  <div class="practice-grid">
    {{ range .ByTitle }}
    <a href="{{ .RelPermalink }}" class="practice-card practice-card--role">
      <span class="practice-card__acronym" aria-hidden="true">{{ .Params.acronym }}</span>
      <div class="practice-card__body">
        <span class="practice-card__title">{{ replaceRE `\s*\([^)]*\)\s*$` "" .Title }}</span>
        {{ with .Params.description }}
        <p class="practice-card__desc">{{ . }}</p>
        {{ end }}
      </div>
      <span class="practice-card__arrow" aria-hidden="true">
        <i class="fa-solid fa-arrow-right"></i>
      </span>
    </a>
    {{ end }}
  </div>
  {{ end }}
{{ end }}
